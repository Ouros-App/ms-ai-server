services:
  api:
    build: .
    environment:
      APP_PORT: 8000
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-}
      INFISICAL_PATH: ${INFISICAL_PATH:-}
      INFISICAL_HOST: ${INFISICAL_HOST:-https://app.infisical.com}
      MONGODB_URI: ${MONGODB_URI_DOCKER:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-mongodb-ai-prod}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-openai/gpt-oss-20b}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      NVIDIA_NIM_FAST_MODEL: ${NVIDIA_NIM_FAST_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-60}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://ouros-keycloak.discloud.app/realms/ouros}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-ms-ai-server}
      MCP_URL: ${MCP_URL:-https://ms-midas-mcp.discloud.app/mcp/}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_TOOLS_CACHE_TTL_SECONDS: ${MCP_TOOLS_CACHE_TTL_SECONDS:-300}
      DEBUG_UI_ENABLED: ${DEBUG_UI_ENABLED:-false}
      DEBUG_UI_AUTH_SERVICE_URL: ${DEBUG_UI_AUTH_SERVICE_URL:-https://ms-auth-service.discloud.app}
      DEBUG_UI_COOKIE_SECURE: ${DEBUG_UI_COOKIE_SECURE:-true}
      DEBUG_UI_REQUEST_TIMEOUT_SECONDS: ${DEBUG_UI_REQUEST_TIMEOUT_SECONDS:-8}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
